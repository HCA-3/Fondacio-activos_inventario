name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fondacio
          POSTGRES_PASSWORD: fondacio
          POSTGRES_DB: fondacio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fondacio -d fondacio_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  imagen:
    name: Imagen y prueba de humo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach
      - name: Esperar a que la app responda
        run: curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8000/health
      - run: curl --fail --silent --show-error http://localhost:8000/health/db
      - run: curl --fail --silent --show-error --output /dev/null http://localhost:8000/
      - name: Registros de la app
        if: always()
        run: docker compose logs app
      - if: always()
        run: docker compose down --volumes

  despliegue:
    name: Despliegue en Render
    needs: [pruebas, imagen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Hace que GitHub muestre en el repo la sección "Deployments" con el enlace a la aplicación.
    environment:
      name: produccion
      url: https://fondacio-inventario.onrender.com
    steps:
      - name: Pedir a Render que despliegue este commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::Falta el secreto RENDER_DEPLOY_HOOK_URL; no se despliega."
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
